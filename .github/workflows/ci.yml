name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       freshmercy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:  postgresql://postgres:postgres@localhost:5432/freshmercy_test
      JWT_SECRET:    ci-test-jwt-secret-minimum-32-characters-here
      NODE_ENV:      test
      FRONTEND_URL:  http://localhost:5173
      EMAIL_PROVIDER: console

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Type-check frontend
        run: npm run typecheck --workspace=apps/web

      - name: Type-check backend
        run: npm run typecheck --workspace=apps/api

      - name: Lint frontend
        run: npm run lint --workspace=apps/web

      - name: Run API tests
        run: npm run test --workspace=apps/api

      - name: Run frontend tests
        run: npm run test --workspace=apps/web

      - name: Build backend
        run: npm run build --workspace=apps/api

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:4000
          VITE_APP_URL: http://localhost:5173
        run: npm run build --workspace=apps/web

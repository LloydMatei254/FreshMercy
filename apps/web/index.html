<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D4A2D" />

    <!-- Primary Meta -->
    <title>Fresh Mercy | Where Mercy Meets You</title>
    <meta name="description" content="Fresh Mercy — Where Mercy Meets You. A gospel-centered community rooted in Lamentations 3:22-23. New mercies every morning." />
    <meta name="keywords" content="gospel, mercy, devotionals, prayer, Christian ministry, Lamentations, scripture, community" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="%VITE_APP_URL%" />
    <meta property="og:title"       content="Fresh Mercy | Where Mercy Meets You" />
    <meta property="og:description" content="A gospel-centered community rooted in Lamentations 3:22-23. New mercies every morning." />
    <meta property="og:image"       content="%VITE_APP_URL%/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Fresh Mercy | Where Mercy Meets You" />
    <meta name="twitter:description" content="A gospel-centered community rooted in Lamentations 3:22-23." />
    <meta name="twitter:image"       content="%VITE_APP_URL%/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fresh Mercy",
      "url": "%VITE_APP_URL%",
      "description": "Where Mercy Meets You — A gospel-centered Christian ministry platform",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
